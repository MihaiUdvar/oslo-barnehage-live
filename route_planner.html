<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- CSP restricts all content sources to trusted origins only. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.gstatic.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://router.project-osrm.org;" />
  <title>Rute for besøk – Oslo Barnehage Finder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-1: #0b1f2a;
      --bg-2: #0f3a46;
      --card: #ffffff;
      --text: #12202a;
      --muted: #5b6b76;
      --line: #dbe5ea;
      --accent: #0f766e;
      --accent-2: #f59e0b;
      --shadow: 0 12px 30px rgba(8, 33, 46, 0.18);
      --radius: 18px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--text);
      font-family: "Source Sans 3", sans-serif;
      background:
        radial-gradient(90rem 40rem at 10% -10%, rgba(245,158,11,0.22), transparent 60%),
        radial-gradient(70rem 50rem at 100% 0%, rgba(22,163,74,0.18), transparent 60%),
        linear-gradient(140deg, var(--bg-1), var(--bg-2));
      min-height: 100vh;
      padding: 18px;
    }

    .shell {
      max-width: 1100px;
      margin: 0 auto;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: var(--shadow);
      background: #ecf4f7;
      animation: reveal .5s ease;
    }

    @keyframes reveal {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .topbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      background: linear-gradient(120deg, #0f3b49, #12685f);
      color: #f2f8f9;
    }

    .title-wrap h1 {
      margin: 0;
      font-family: "Space Grotesk", sans-serif;
      font-weight: 700;
      font-size: clamp(20px, 3vw, 30px);
      letter-spacing: 0.2px;
    }

    .title-wrap p {
      margin: 4px 0 0;
      opacity: 0.9;
      font-size: 14px;
    }

    .back-link {
      color: #fff;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      padding: 8px 12px;
      border-radius: 10px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.35);
      white-space: nowrap;
    }

    .back-link:hover { background: rgba(255,255,255,0.2); }

    .content {
      padding: 20px;
    }

    .planner {
      background: #f6fbfd;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 16px;
      display: grid;
      gap: 12px;
    }

    .planner-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .field label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      font-size: 13px;
      color: #1f3b48;
    }

    .field input, .field select {
      width: 100%;
      border: 1px solid #cddde3;
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 14px;
      background: #fff;
    }

    .planner-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn-action {
      border: 1px solid var(--accent);
      border-radius: 12px;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      background: var(--accent);
      color: #fff;
      transition: .2s ease;
    }

    .btn-action:hover { background: #0d5f59; }

    .btn-secondary {
      border: 1px solid #cddde3;
      background: #fff;
      color: #1f3b48;
    }

    .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }

    .route-error {
      background: #fdecea;
      border: 1px solid #f3b6ae;
      color: #9c2c1f;
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 13px;
      display: none;
    }

    .route-warning {
      background: #fef6e7;
      border: 1px solid #f0d38a;
      color: #7a5b06;
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 13px;
      display: none;
    }

    .live-status {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 12px;
      padding: 8px 12px;
      border-radius: 10px;
      background: rgba(255,255,255,0.5);
      border: 1px solid var(--line);
    }
    .live-status.ok { color: #0d5f59; border-color: #bfe3df; background: #eefaf8; }
    .live-status.fail { color: #9c2c1f; border-color: #f3b6ae; background: #fdecea; }

    .saved-routes-title {
      font-weight: 600;
      font-size: 13px;
      color: #1f3b48;
      margin-bottom: 6px;
    }

    .saved-routes-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .saved-route {
      display: inline-flex;
      align-items: stretch;
      border: 1px solid #cddde3;
      border-radius: 999px;
      overflow: hidden;
      background: #fff;
    }

    .saved-route.active { border-color: var(--accent); }

    .saved-route button {
      border: 0;
      background: transparent;
      cursor: pointer;
      font-size: 13px;
      color: #1f3b48;
      padding: 6px 10px;
    }

    .saved-route.active .saved-route-load {
      color: var(--accent);
      font-weight: 600;
    }

    .saved-route-load small { color: var(--muted); font-weight: 400; }

    .saved-route-delete {
      border-left: 1px solid #e2ecf0 !important;
      color: #9c2c1f !important;
      font-weight: 700;
    }
    .saved-route-delete:hover { background: #fdecea !important; }

    .results-heading {
      margin: 20px 0 10px;
      font-family: "Space Grotesk", sans-serif;
      font-size: 18px;
      color: #0f3b49;
    }

    .result-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 10px;
    }

    .card {
      background: white;
      border: 1px solid #dbe7ec;
      border-radius: 14px;
      padding: 12px;
      display: grid;
      gap: 8px;
    }

    .card-no-live {
      background: #fdecea;
      border-color: #f3b6ae;
    }

    .chip-no-live {
      background: #fbdad3;
      border-color: #eba99c;
      color: #7a2b1e;
    }

    .card h3 {
      margin: 0;
      font-size: 16px;
      font-family: "Space Grotesk", sans-serif;
      line-height: 1.25;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .chip {
      font-size: 12px;
      background: #f1f7fa;
      border: 1px solid #d8e6ed;
      padding: 4px 8px;
      border-radius: 999px;
      color: #284353;
    }

    .chip-order {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      font-weight: 700;
    }

    .meta { font-size: 13px; color: #3a5565; }
    .route-distance { font-weight: 600; color: var(--accent); }
    .live-updated { font-size: 12px; color: var(--muted); }
    .addr-link {
      color: inherit;
      text-decoration: underline;
      text-decoration-color: #9db8c4;
      text-underline-offset: 2px;
    }
    .addr-link:hover { color: var(--accent); }

    .btn {
      display: inline-block !important;
      padding: 8px 14px !important;
      margin: 4px 2px !important;
      background: #0f766e !important;
      color: #fff !important;
      text-decoration: none !important;
      border-radius: 6px;
      font-size: 13px !important;
      font-weight: 600 !important;
    }
    .btn:hover { background: #0d5f59 !important; }

    .empty {
      background: #fff;
      border: 1px dashed #b8ccd6;
      border-radius: 14px;
      padding: 16px;
      color: #4e6472;
    }

    @media (max-width: 640px) {
      .planner-grid { grid-template-columns: 1fr; }
      .result-grid { grid-template-columns: 1fr; }
      body { padding: 10px; }
      .shell { border-radius: 16px; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="title-wrap">
        <h1>Rute for besøk</h1>
        <p>Sorter barnehagene i en bydel etter avstand fra et startpunkt</p>
      </div>
      <a href="./barnehage_filter_app.html" class="back-link">← Finn barnehageplass</a>
    </header>

    <div class="content">
      <div id="liveStatus" class="live-status"></div>
      <div class="planner">
        <div class="planner-grid">
          <div class="field">
            <label for="startPoint">Startpunkt</label>
            <input id="startPoint" type="text" placeholder="Google Maps-lenke (også forkortet) eller lat,lng" />
          </div>
          <div class="field">
            <label for="bydelSelect">Bydel</label>
            <select id="bydelSelect"><option value="">Velg bydel</option></select>
          </div>
        </div>
        <div class="planner-actions">
          <button id="buildBtn" class="btn-action" type="button">Lag rute</button>
          <button id="clearBtn" class="btn-action btn-secondary" type="button">Fjern rute</button>
        </div>
        <div id="routeError" class="route-error"></div>
        <div id="routeWarning" class="route-warning"></div>
        <div id="savedRoutes" class="saved-routes" style="display:none">
          <div class="saved-routes-title">Lagrede ruter</div>
          <div id="savedRoutesList" class="saved-routes-list"></div>
        </div>
      </div>

      <div id="resultsHeading" class="results-heading" style="display:none"></div>
      <div id="results" class="result-grid"></div>
    </div>
  </div>

  <script src="./barnehage_data.js"></script>
  <script src="./barnehage_live_data.js"></script>
  <script src="./route_planner.js"></script>
</body>
</html>
